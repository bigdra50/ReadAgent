# Issue / PR で `@claude` とメンションすると Claude Code が応答する。
# 事前準備: リポジトリの Secrets に CLAUDE_CODE_OAUTH_TOKEN を登録する
#   ローカルで `claude setup-token` を実行して発行（Claude サブスクリプションを利用）
# Secrets 未設定のリポジトリでも CI が赤くならないようガードしている。
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: read

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Token 未設定なら何もしない
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN が未設定のためスキップしました"

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_TOKEN == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(pnpm install),Bash(pnpm run:*),Bash(pnpm exec:*),Bash(git diff:*),Bash(git log:*)"
