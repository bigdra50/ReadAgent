name: バグ
description: 想定と異なる挙動
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 起きたこと
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した挙動
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 再現手順
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 環境
      placeholder: "OS / Node / pnpm / 対象PDF の特徴など"
